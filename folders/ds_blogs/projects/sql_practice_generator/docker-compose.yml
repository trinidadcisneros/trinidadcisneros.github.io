services:
  postgres:
    image: postgres:16-alpine
    container_name: sql_practice_postgres
    environment:
      POSTGRES_USER: practice
      POSTGRES_PASSWORD: practice
      POSTGRES_DB: practice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice -d practice"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: sql_practice_mysql
    environment:
      MYSQL_ROOT_PASSWORD: practice
      MYSQL_USER: practice
      MYSQL_PASSWORD: practice
      MYSQL_DATABASE: practice
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppractice"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

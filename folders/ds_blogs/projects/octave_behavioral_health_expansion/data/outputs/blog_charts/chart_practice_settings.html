<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #fff; }
        .legend-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 8px 0 4px 0;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #333;
        }
        .legend-swatch {
            width: 14px;
            height: 14px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        #chart { width: 100%; height: 380px; }
    </style>
</head>
<body>

<div class="legend-container">
    <div class="legend-item"><div class="legend-swatch" style="background:#2E86AB"></div>Private Practice / Small Group</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#d35400"></div>Outpatient MH Centers</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#8B0000"></div>Psychiatric Hospitals</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#95a5a6"></div>Other Settings</div>
</div>

<div id="chart"></div>

<script>
// Data from NB02b BLS OES May 2024
var occupations = ['All BH Providers', 'Psychologists', 'MH & SA Counselors', 'MH & SA Social Workers', 'Psychiatrists'];

var privatePractice = [17.4, 39.1, 15.9, 12.7, 4.7];
var outpatientCtrs  = [17.2, 6.6, 19.0, 18.3, 9.3];
var psychHospitals  = [4.8, 3.5, 4.0, 6.9, 12.0];
var otherSettings   = [60.6, 50.8, 61.1, 62.1, 73.9];

var totals = [660620, 71430, 439420, 125330, 24440];

function makeTrace(name, vals, color) {
    return {
        x: vals,
        y: occupations,
        name: name,
        type: 'bar',
        orientation: 'h',
        marker: { color: color, opacity: 0.85 },
        hoverinfo: 'text',
        text: vals.map(function(v, i) {
            return '<b>' + occupations[i] + '</b><br>' + name + ': ' + v + '%<br>(' + totals[i].toLocaleString() + ' total employed)';
        }),
        showlegend: false
    };
}

var data = [
    makeTrace('Private Practice / Small Group', privatePractice, '#2E86AB'),
    makeTrace('Outpatient MH Centers', outpatientCtrs, '#d35400'),
    makeTrace('Psychiatric Hospitals', psychHospitals, '#8B0000'),
    makeTrace('Other Settings', otherSettings, '#95a5a6')
];

var layout = {
    barmode: 'stack',
    margin: { l: 175, r: 30, t: 10, b: 40 },
    xaxis: {
        title: 'Share of Employment (%)',
        range: [0, 105],
        dtick: 20,
        gridcolor: '#e0e0e0'
    },
    yaxis: {
        automargin: true,
        tickfont: { size: 12 }
    },
    paper_bgcolor: '#fff',
    plot_bgcolor: '#fff',
    font: { family: 'Segoe UI, Arial, sans-serif', size: 12 },
    showlegend: false
};

Plotly.newPlot('chart', data, layout, {displayModeBar: false, responsive: true});
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1f4788;
            margin-bottom: 10px;
        }
        #plotDiv {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="plotDiv"></div>
    </div>
    <script>
        var data = [{"x": ["Wave 1: Q1-2 (6 months)", "Wave 2: Q3-4 (12 months)", "Wave 3: Year 2 (18 months)", "Wave 4: Year 2+ (24+ months)"], "y": [27.6926, 20.0148, 11.2398, 36.2908], "type": "bar", "text": ["$27.7M", "$20.0M", "$11.2M", "$36.3M"], "textposition": "outside", "marker": {"color": ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728"]}, "hovertemplate": "<b>%{x}</b><br>Revenue: $%{y:.1f}M<extra></extra>"}];
        var layout = {"title": "Hypothetical Annual Revenue by Expansion Wave (Conservative: 0.5% Penetration)", "xaxis": {"title": "Expansion Wave"}, "yaxis": {"title": "Annual Revenue ($M)"}, "width": 900, "height": 500, "showlegend": false, "plot_bgcolor": "rgba(240, 240, 240, 0.5)"};
        Plotly.newPlot('plotDiv', data, layout, {responsive: true});
    </script>
</body>
</html>

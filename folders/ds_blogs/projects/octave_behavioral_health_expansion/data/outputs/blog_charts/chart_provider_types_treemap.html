function buildTrace(data, pathbarColor) {
    // Format display totals with commas
    var formattedTotals = data.display_totals.map(function(v) {
        return v.toLocaleString();
    });

        type: "treemap",
        ids: data.ids,
        labels: data.labels,
        parents: data.parents,
        values: data.values,
        customdata: formattedTotals,
        hovertemplate: "<b>%{label}</b><br>%{customdata} providers<br>%{percentParent:.1%} of parent<extra></extra>",

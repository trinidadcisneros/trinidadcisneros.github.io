<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background-color: white; }
        #plotDiv { width: 100%; height: 100%; }
        .legend-container {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 10px 0 4px 0;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #333;
        }
        .legend-swatch {
            width: 18px;
            height: 14px;
            border-radius: 2px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="legend-container">
        <div class="legend-item"><div class="legend-swatch" style="background:#1a9850;"></div>All 3 Compacts</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#91cf60;"></div>2 Compacts</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#d9ef8b;"></div>1 Compact</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#f0f0f0;"></div>No Compacts</div>
    </div>
    <div id="plotDiv"></div>
    <script>
        // PSYPACT members (42 states)
        var psypact = new Set(['AL','AZ','AR','CO','CT','DE','DC','FL','GA','ID','IL','IN','KS','KY','ME','MD','MI','MN','MO','MS','MT','NE','NV','NH','NJ','NC','ND','OH','OK','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY']);
        // Counseling Compact (38 states — live + enacted)
        var counseling = new Set(['AZ','MN','OH','AL','AR','CO','CT','DE','FL','GA','ID','IN','IA','KS','KY','LA','ME','MD','MI','MS','MO','MT','NE','NH','NJ','NC','ND','OK','RI','SC','SD','TN','UT','VA','WA','WV','WI','WY']);
        // Social Work Compact (30 states)
        var socialWork = new Set(['AL','AZ','AR','CO','CT','DE','GA','IA','KS','KY','LA','ME','MD','MN','MS','MO','NE','NH','NJ','NC','ND','OH','OK','RI','SC','SD','TN','UT','VT','VA','WA']);

        var states = ["CT","NJ","ME","KY","IN","DE","CO","OH","VA","MO","NH","WV","DC","GA","AZ","MN","NV","MT","TN","WA","NE","RI","NM","PA","WI","FL","OK","OR","MD","IA","NC","LA","UT","KS","MS","WY","CA","NY","VT","ID","AK","ND","SD","SC","IL","MI","MA","AR","TX","HI","AL"];
        var names = ["Connecticut","New Jersey","Maine","Kentucky","Indiana","Delaware","Colorado","Ohio","Virginia","Missouri","New Hampshire","West Virginia","District of Columbia","Georgia","Arizona","Minnesota","Nevada","Montana","Tennessee","Washington","Nebraska","Rhode Island","New Mexico","Pennsylvania","Wisconsin","Florida","Oklahoma","Oregon","Maryland","Iowa","North Carolina","Louisiana","Utah","Kansas","Mississippi","Wyoming","California","New York","Vermont","Idaho","Alaska","North Dakota","South Dakota","South Carolina","Illinois","Michigan","Massachusetts","Arkansas","Texas","Hawaii","Alabama"];

        // Build per-state compact detail and count
        var compactCounts = [];
        var hoverTexts = [];
        for (var i = 0; i < states.length; i++) {
            var abbr = states[i];
            var memberOf = [];
            if (psypact.has(abbr)) memberOf.push('PSYPACT');
            if (counseling.has(abbr)) memberOf.push('Counseling');
            if (socialWork.has(abbr)) memberOf.push('Social Work');
            compactCounts.push(memberOf.length);

            var detail = memberOf.length > 0 ? memberOf.join(', ') : 'None';
            hoverTexts.push('<b>' + names[i] + '</b><br>Compacts (' + memberOf.length + '): ' + detail);
        }

        var tierColors = { 3: '#1a9850', 2: '#91cf60', 1: '#d9ef8b', 0: '#f0f0f0' };

        var traces = [];
        [3, 2, 1, 0].forEach(function(tier) {
            var locs = [], zvals = [], hovers = [];
            for (var i = 0; i < states.length; i++) {
                if (compactCounts[i] === tier) {
                    locs.push(states[i]);
                    zvals.push(tier);
                    hovers.push(hoverTexts[i]);
                }
            }
            traces.push({
                type: 'choropleth',
                locations: locs,
                z: zvals,
                locationmode: 'USA-states',
                colorscale: [[0, tierColors[tier]], [1, tierColors[tier]]],
                showscale: false,
                showlegend: false,
                hoverinfo: 'text',
                text: hovers,
                zmin: 0,
                zmax: 3
            });
        });

        var layout = {
            title: {
                text: 'Interstate Compacts Enable Faster Market Entry',
                x: 0.5, xanchor: 'center',
                font: { size: 18 }
            },
            geo: {
                scope: 'usa',
                projection: { type: 'albers usa' },
                showlakes: true,
                lakecolor: 'rgb(255, 255, 255)'
            },
            width: 1000,
            height: 560,
            margin: { t: 50, b: 20, l: 20, r: 20 }
        };

        Plotly.newPlot('plotDiv', traces, layout, { responsive: true });
    </script>
</body>
</html>

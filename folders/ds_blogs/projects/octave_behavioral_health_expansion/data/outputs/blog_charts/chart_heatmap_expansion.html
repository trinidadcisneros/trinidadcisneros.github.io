<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background-color: white; }
        #plotDiv { width: 100%; }
    </style>
</head>
<body>
    <div id="plotDiv"></div>
    <script>
        // States sorted by composite score (highest at top)
        var states = [
            "Alabama","Hawaii","Arkansas","Michigan","South Dakota","North Dakota",
            "Alaska","Idaho","Vermont","Wyoming","Mississippi","Kansas",
            "Utah","Louisiana","Iowa","Oklahoma","New Mexico","Rhode Island",
            "Nebraska","Montana","Nevada","West Virginia","New Hampshire",
            "Missouri","Delaware","Indiana","Kentucky","Maine"
        ];

        // Dimension columns (matching the 6 scoring dimensions + composite)
        var dimensions = [
            "Payer<br>Coverage","Provider<br>Pool","Unmet<br>Demand",
            "Competition","Regulatory<br>Ease","Reimburse-<br>ment","Composite"
        ];

        // Scores: each sub-array is one dimension across all 28 states (ordered AL→ME bottom to top)
        var payerCoverage =    [0.6,3.4,12.4,21.5,23.7,24.3,10.2,19.2,15.8,18.1,0.0,30.5,50.3,9.6,39.5,21.5,24.3,23.2,31.6,17.5,62.1,48.0,72.3,59.3,64.4,96.0,76.3,80.2];
        var providerPool =     [0.0,11.6,3.9,2.6,16.3,16.5,8.3,4.1,37.0,20.1,2.4,9.2,8.4,10.2,11.9,4.3,8.7,21.8,10.9,13.4,3.3,17.1,26.4,5.8,9.4,4.7,7.9,20.3];
        var unmetDemand =      [60.5,29.6,73.5,61.7,52.5,49.4,81.5,75.9,43.2,73.5,100.0,57.4,38.3,92.0,48.8,85.8,89.5,36.4,53.7,82.7,63.6,96.9,45.7,66.7,53.1,64.2,84.0,60.5];
        var competition =      [39.7,60.3,50.8,50.8,66.7,68.3,98.4,85.7,71.4,73.0,82.5,81.0,47.6,69.8,77.8,73.0,82.5,93.7,84.1,92.1,77.8,87.3,60.3,60.3,95.2,60.3,42.9,61.9];
        var regulatoryEase =   [57.9,35.5,57.9,39.5,57.9,59.2,0.0,40.8,42.1,40.8,56.6,57.9,59.2,39.5,42.1,57.9,44.7,61.8,97.4,80.3,21.1,40.8,60.5,98.7,98.7,80.3,98.7,97.4];
        var reimbursement =    [25.0,75.0,0.0,50.0,0.0,0.0,50.0,0.0,25.0,0.0,0.0,0.0,25.0,25.0,25.0,25.0,25.0,75.0,0.0,0.0,50.0,25.0,50.0,25.0,25.0,25.0,25.0,25.0];
        var compositeScore =   [27.4,27.9,32.3,34.2,35.0,35.0,35.4,35.5,35.9,36.7,37.2,37.7,38.1,38.2,38.6,41.9,43.2,43.6,43.8,44.8,44.8,52.2,52.6,52.7,55.4,58.4,59.0,59.5];

        var z = [payerCoverage, providerPool, unmetDemand, competition, regulatoryEase, reimbursement, compositeScore];

        // Transpose: we want states as rows (y) and dimensions as columns (x)
        var zTransposed = [];
        for (var s = 0; s < states.length; s++) {
            var row = [];
            for (var d = 0; d < dimensions.length; d++) {
                row.push(z[d][s]);
            }
            zTransposed.push(row);
        }

        var data = [{
            type: "heatmap",
            z: zTransposed,
            x: dimensions,
            y: states,
            colorscale: [
                [0, "#d73027"],
                [0.25, "#fc8d59"],
                [0.5, "#fee08b"],
                [0.75, "#d9ef8b"],
                [1, "#1a9850"]
            ],
            zmin: 0,
            zmax: 100,
            colorbar: {
                title: { text: "Score (0-100)", side: "right" },
                thickness: 15,
                len: 0.9
            },
            hovertemplate: "<b>%{y}</b><br>%{x}: %{z:.1f}<extra></extra>",
            xgap: 2,
            ygap: 2
        }];

        // Add score annotations on each cell
        var annotations = [];
        for (var s = 0; s < states.length; s++) {
            for (var d = 0; d < dimensions.length; d++) {
                var val = zTransposed[s][d];
                annotations.push({
                    x: dimensions[d],
                    y: states[s],
                    text: val.toFixed(0),
                    showarrow: false,
                    font: {
                        size: 10,
                        color: val > 65 || val < 20 ? "white" : "#333"
                    }
                });
            }
        }

        var layout = {
            title: {
                text: "Payer Coverage and Provider Pool Are the Weakest Dimensions Across Expansion States",
                x: 0.5,
                xanchor: "center",
                font: { size: 16 },
                y: 0.98
            },
            xaxis: {
                side: "top",
                tickangle: 0,
                tickfont: { size: 11 }
            },
            yaxis: {
                tickfont: { size: 11 },
                autorange: true
            },
            width: 900,
            height: 950,
            margin: { t: 100, b: 20, l: 110, r: 80 },
            annotations: annotations
        };

        Plotly.newPlot('plotDiv', data, layout, {responsive: true});
    </script>
</body>
</html>

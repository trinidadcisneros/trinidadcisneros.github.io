<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background-color: white; }
        #plotDiv { width: 100%; }
        .html-legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            padding: 8px 0 4px 0;
            font-size: 13px;
            font-family: Arial, sans-serif;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.2s;
        }
        .legend-item.hidden {
            opacity: 0.3;
        }
        .legend-swatch {
            width: 16px;
            height: 4px;
            border-radius: 2px;
            position: relative;
        }
        .legend-swatch::after {
            content: '';
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            top: -1.5px;
            left: 4.5px;
            background: inherit;
        }
    </style>
</head>
<body>
    <div class="html-legend" id="legend"></div>
    <div id="plotDiv"></div>

    <script>
        var dimensions = ["Provider Pool", "Payer Coverage", "Unmet Demand", "Competitive Advantage", "Regulatory Ease", "Reimbursement", "Provider Pool"];

        var states = [
            { name: "Maine", r: [20.3, 80.2, 60.5, 61.9, 97.4, 25.0, 20.3], color: "31,119,180" },
            { name: "Kentucky", r: [7.9, 76.3, 84.0, 42.9, 98.7, 25.0, 7.9], color: "255,127,14" },
            { name: "Indiana", r: [4.7, 96.0, 64.2, 60.3, 80.3, 25.0, 4.7], color: "44,160,44" },
            { name: "Delaware", r: [9.4, 64.4, 53.1, 95.2, 98.7, 25.0, 9.4], color: "214,39,40" },
            { name: "Missouri", r: [5.8, 59.3, 66.7, 60.3, 98.7, 25.0, 5.8], color: "148,103,189" }
        ];

        // Track visibility
        var visible = states.map(function() { return true; });

        // Build HTML legend above chart
        var legendEl = document.getElementById('legend');
        states.forEach(function(s, i) {
            var item = document.createElement('div');
            item.className = 'legend-item';
            item.setAttribute('data-index', i);
            item.innerHTML = '<span class="legend-swatch" style="background:rgba(' + s.color + ',0.9);"></span>' +
                '<span>' + s.name + '</span>';
            item.addEventListener('click', function() {
                var idx = parseInt(this.getAttribute('data-index'));
                visible[idx] = !visible[idx];
                this.classList.toggle('hidden');
                Plotly.restyle('plotDiv', { visible: visible[idx] ? true : 'legendonly' }, [idx]);
            });
            legendEl.appendChild(item);
        });

        var data = states.map(function(s) {
            return {
                type: "scatterpolar",
                r: s.r,
                theta: dimensions,
                fill: "toself",
                name: s.name,
                line: { color: "rgba(" + s.color + ",0.9)", width: 2 },
                fillcolor: "rgba(" + s.color + ",0.12)",
                hovertemplate: "<b>" + s.name + "</b><br>%{theta}: %{r:.1f}<extra></extra>",
                showlegend: false
            };
        });

        var layout = {
            title: {
                text: "Top 5 Expansion States: Dimension-Level Scoring Profiles",
                x: 0.5,
                xanchor: "center",
                font: { size: 17 }
            },
            polar: {
                radialaxis: {
                    visible: true,
                    range: [0, 100],
                    tickfont: { size: 10, color: "#999" }
                },
                angularaxis: {
                    tickfont: { size: 12 }
                }
            },
            width: 900,
            height: 560,
            showlegend: false,
            margin: { t: 60, b: 20, l: 60, r: 60 }
        };

        Plotly.newPlot('plotDiv', data, layout, {responsive: true});
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background-color: white; }
        #plotDiv { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="plotDiv"></div>
    <script>
        var dimensions = ['Payer\nCoverage', 'Provider\nPool', 'Unmet\nDemand', 'Competition', 'Regulatory\nEase', 'Reimbursement', 'Composite\nScore'];

        // 3-group averages computed from scoring data
        var top7Avg     = [70.9, 13.1, 67.3, 66.9, 82.2, 28.6, 55.7];
        var currentAvg  = [55.5, 11.0, 39.9, 47.2, 69.2, 57.6, 44.9];
        var remain21Avg = [21.9, 10.7, 64.3, 72.7, 50.0, 22.6, 37.5];

        var top7States = 'ME, KY, IN, DE, MO, NH, WV';
        var currentCount = '23 states incl. CA, NY, TX, FL, PA';
        var remain21Count = '21 states incl. NV, MT, IA, MI, AL';

        var data = [
            {
                type: 'bar',
                name: 'Top 7 Expansion Markets',
                x: dimensions,
                y: top7Avg,
                text: top7Avg.map(function(v) { return v.toFixed(1); }),
                textposition: 'outside',
                textfont: { size: 11, color: '#1a7a3a', weight: 'bold' },
                marker: { color: '#1a9850', opacity: 0.9 },
                hovertemplate: dimensions.map(function(d, i) {
                    return '<b>Top 7 Expansion Markets</b>' +
                           '<br>' + d.replace(/\n/g, ' ') + ': ' + top7Avg[i].toFixed(1) +
                           '<br><i>' + top7States + '</i>' +
                           '<extra></extra>';
                })
            },
            {
                type: 'bar',
                name: 'Current Octave States (23)',
                x: dimensions,
                y: currentAvg,
                text: currentAvg.map(function(v) { return v.toFixed(1); }),
                textposition: 'outside',
                textfont: { size: 11, color: '#2567a0' },
                marker: { color: '#3182bd', opacity: 0.85 },
                hovertemplate: dimensions.map(function(d, i) {
                    return '<b>Current Octave States (23)</b>' +
                           '<br>' + d.replace(/\n/g, ' ') + ': ' + currentAvg[i].toFixed(1) +
                           '<br><i>' + currentCount + '</i>' +
                           '<extra></extra>';
                })
            },
            {
                type: 'bar',
                name: 'Remaining 21 Expansion States',
                x: dimensions,
                y: remain21Avg,
                text: remain21Avg.map(function(v) { return v.toFixed(1); }),
                textposition: 'outside',
                textfont: { size: 11, color: '#777' },
                marker: { color: '#bdbdbd', opacity: 0.8 },
                hovertemplate: dimensions.map(function(d, i) {
                    return '<b>Remaining 21 Expansion States</b>' +
                           '<br>' + d.replace(/\n/g, ' ') + ': ' + remain21Avg[i].toFixed(1) +
                           '<br><i>' + remain21Count + '</i>' +
                           '<extra></extra>';
                })
            }
        ];

        var layout = {
            title: {
                text: 'Top Expansion Markets Outscore Current Octave States on 5 of 6 Dimensions',
                x: 0.5, xanchor: 'center',
                font: { size: 16 }
            },
            xaxis: {
                title: '',
                tickangle: 0,
                tickfont: { size: 12 }
            },
            yaxis: {
                title: 'Average Score (0–100)',
                range: [0, 95],
                gridcolor: '#eee'
            },
            barmode: 'group',
            bargap: 0.25,
            bargroupgap: 0.08,
            legend: {
                orientation: 'h',
                x: 0.5, xanchor: 'center',
                y: -0.12,
                font: { size: 12 }
            },
            width: 920,
            height: 520,
            margin: { t: 55, b: 90, l: 60, r: 20 },
            annotations: [
                {
                    text: 'Only reimbursement rates favor current states — top expansion markets lead on payer access, demand, competition, and regulatory readiness',
                    x: 0.5, y: -0.22, xref: 'paper', yref: 'paper',
                    showarrow: false,
                    font: { size: 11, color: '#666', style: 'italic' }
                }
            ],
            plot_bgcolor: 'white',
            paper_bgcolor: 'white'
        };

        Plotly.newPlot('plotDiv', data, layout, { responsive: true });
    </script>
</body>
</html>

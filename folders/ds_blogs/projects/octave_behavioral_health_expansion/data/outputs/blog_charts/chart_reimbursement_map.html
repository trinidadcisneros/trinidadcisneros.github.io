<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background-color: white; }
        #plotDiv { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="plotDiv"></div>
    <script>
        var data = [{
            type: 'choropleth',
            locations: ["CT","NJ","ME","KY","IN","DE","CO","OH","VA","MO","NH","WV","DC","GA","AZ","MN","NV","MT","TN","WA","NE","RI","NM","PA","WI","FL","OK","OR","MD","IA","NC","LA","UT","KS","MS","WY","CA","NY","VT","ID","AK","ND","SD","SC","IL","MI","MA","AR","TX","HI","AL"],
            z: [161,165,142,137,138,141,149,145,149,141,145,135,172,139,145,153,149,134,142,156,134,158,139,154,147,146,135,150,152,135,141,138,139,133,130,133,158,173,143,134,154,131,133,138,150,147,168,131,146,164,137],
            text: ["Connecticut","New Jersey","Maine","Kentucky","Indiana","Delaware","Colorado","Ohio","Virginia","Missouri","New Hampshire","West Virginia","District of Columbia","Georgia","Arizona","Minnesota","Nevada","Montana","Tennessee","Washington","Nebraska","Rhode Island","New Mexico","Pennsylvania","Wisconsin","Florida","Oklahoma","Oregon","Maryland","Iowa","North Carolina","Louisiana","Utah","Kansas","Mississippi","Wyoming","California","New York","Vermont","Idaho","Alaska","North Dakota","South Dakota","South Carolina","Illinois","Michigan","Massachusetts","Arkansas","Texas","Hawaii","Alabama"],
            locationmode: 'USA-states',
            colorscale: [
                [0, '#c6dbef'],
                [0.25, '#6baed6'],
                [0.5, '#3182bd'],
                [0.75, '#1c6fb5'],
                [1, '#08306b']
            ],
            colorbar: {
                title: { text: 'Medicare<br>90837 Rate', font: { size: 12 } },
                thickness: 18,
                len: 0.6,
                tickprefix: '$',
                tickformat: ',d'
            },
            hovertemplate: '<b>%{text}</b><br>Medicare 90837 Rate: $%{z}<extra></extra>',
            zmin: 125,
            zmax: 175
        }];

        var layout = {
            title: {
                text: 'Higher Reimbursement States Are More Attractive for Provider Recruitment',
                x: 0.5,
                xanchor: 'center',
                font: { size: 18 }
            },
            geo: {
                scope: 'usa',
                projection: { type: 'albers usa' },
                showlakes: true,
                lakecolor: 'rgb(255, 255, 255)'
            },
            width: 1000,
            height: 600,
            margin: { t: 60, b: 30, l: 20, r: 20 }
        };

        Plotly.newPlot('plotDiv', data, layout, { responsive: true });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background-color: white; }
        #plotDiv { width: 100%; height: 100%; }
        .legend-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 8px 0 2px 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #333;
        }
        .legend-swatch {
            width: 20px;
            height: 14px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="legend-container">
        <div class="legend-item"><div class="legend-swatch" style="background:#2E86AB;"></div>Current Octave States (23)</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#d35400;"></div>Expansion States (28)</div>
    </div>
    <div id="plotDiv"></div>
    <script>
        var dimensions = ['Payer<br>Coverage', 'Provider<br>Pool', 'Unmet<br>Demand', 'Regulatory<br>Ease', 'Competition', 'Reimbursement', 'Composite'];

        var currentAvg = [55.5, 11.0, 39.9, 69.2, 47.2, 57.6, 44.9];
        var expansionAvg = [34.1, 11.3, 65.0, 58.0, 71.3, 24.1, 42.0];

        var data = [
            {
                type: 'bar',
                name: 'Current Octave States (23)',
                x: dimensions,
                y: currentAvg,
                text: currentAvg.map(function(v) { return v.toFixed(1); }),
                textposition: 'outside',
                textfont: { size: 11, color: '#2E86AB' },
                marker: { color: '#2E86AB' },
                showlegend: false,
                hovertemplate: '<b>%{x}</b><br>Current States Avg: %{y:.1f}<extra></extra>'
            },
            {
                type: 'bar',
                name: 'Expansion States (28)',
                x: dimensions,
                y: expansionAvg,
                text: expansionAvg.map(function(v) { return v.toFixed(1); }),
                textposition: 'outside',
                textfont: { size: 11, color: '#d35400' },
                marker: { color: '#d35400' },
                showlegend: false,
                hovertemplate: '<b>%{x}</b><br>Expansion States Avg: %{y:.1f}<extra></extra>'
            }
        ];

        var layout = {
            title: {
                text: 'Expansion States Trade Payer Coverage for Less Competition and Higher Unmet Demand',
                x: 0.5, xanchor: 'center',
                font: { size: 16 }
            },
            xaxis: {
                title: '',
                tickangle: 0
            },
            yaxis: {
                title: 'Average Score (0-100)',
                range: [0, 85]
            },
            barmode: 'group',
            width: 900,
            height: 480,
            margin: { t: 50, b: 60, l: 60, r: 30 }
        };

        Plotly.newPlot('plotDiv', data, layout, { responsive: true });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #fff; }
        .legend-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 8px 0 4px 0;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #333;
        }
        .legend-swatch {
            width: 14px;
            height: 14px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        #chart { width: 100%; height: 280px; }
    </style>
</head>
<body>

<div class="legend-container">
    <div class="legend-item"><div class="legend-swatch" style="background:#2E86AB"></div>Private Practice / Small Group</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#d35400"></div>Outpatient MH Centers</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#8B0000"></div>Psychiatric Hospitals</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#95a5a6"></div>Other Settings</div>
</div>

<div id="chart"></div>

<script>
// Data from NB02b — BLS OES Research Estimates by State and Industry, Sector 62, May 2024
// Weighted averages (employment-weighted, not simple state averages)
var categories = ['Expansion States (n=29)', 'Current Octave States (n=23)', 'National'];

// Weighted percentages
var privatePractice = [18.3, 20.7, 20.2];
var outpatientCtrs  = [22.8, 20.0, 20.6];
var psychHospitals  = [4.9, 5.0, 5.0];
var otherSettings   = [54.0, 54.2, 54.2];

var totals = [117730, 420270, 538000];

function makeTrace(name, vals, color) {
    return {
        x: vals,
        y: categories,
        name: name,
        type: 'bar',
        orientation: 'h',
        marker: { color: color, opacity: 0.85 },
        hoverinfo: 'text',
        text: vals.map(function(v, i) {
            return '<b>' + categories[i] + '</b><br>' + name + ': ' + v + '%<br>(' + totals[i].toLocaleString() + ' total BH providers)';
        }),
        showlegend: false
    };
}

var data = [
    makeTrace('Private Practice / Small Group', privatePractice, '#2E86AB'),
    makeTrace('Outpatient MH Centers', outpatientCtrs, '#d35400'),
    makeTrace('Psychiatric Hospitals', psychHospitals, '#8B0000'),
    makeTrace('Other Settings', otherSettings, '#95a5a6')
];

var layout = {
    barmode: 'stack',
    margin: { l: 210, r: 30, t: 10, b: 40 },
    xaxis: {
        title: 'Share of BH Employment (%)',
        range: [0, 105],
        dtick: 20,
        gridcolor: '#e0e0e0'
    },
    yaxis: {
        automargin: true,
        tickfont: { size: 12 }
    },
    paper_bgcolor: '#fff',
    plot_bgcolor: '#fff',
    font: { family: 'Segoe UI, Arial, sans-serif', size: 12 },
    showlegend: false
};

Plotly.newPlot('chart', data, layout, {displayModeBar: false, responsive: true});
</script>

</body>
</html>

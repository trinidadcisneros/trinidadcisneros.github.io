<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2c7fb8"/>
    </linearGradient>
    <linearGradient id="phase1Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c7fb8"/>
      <stop offset="100%" stop-color="#2471a3"/>
    </linearGradient>
    <linearGradient id="phase2Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e8449"/>
      <stop offset="100%" stop-color="#196f3d"/>
    </linearGradient>
    <linearGradient id="phase3Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d3c98"/>
      <stop offset="100%" stop-color="#6c3483"/>
    </linearGradient>
    <linearGradient id="phase4Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d95f0e"/>
      <stop offset="100%" stop-color="#c0500a"/>
    </linearGradient>
    <linearGradient id="phase5Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e34a33"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="#fafbfc" rx="8"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="url(#headerGrad)" rx="8"/>
  <rect x="0" y="60" width="1200" height="15" fill="url(#headerGrad)"/>
  <text x="600" y="38" text-anchor="middle" fill="white" font-size="22" font-weight="bold">Methods Overview</text>
  <text x="600" y="58" text-anchor="middle" fill="#aed6f1" font-size="12">Identifying Virtual Care Opportunities: Linking Provider Network Connectivity to Maternal Morbidity</text>

  <!-- DATA SOURCES ROW -->
  <text x="600" y="108" text-anchor="middle" fill="#1a5276" font-size="14" font-weight="bold" letter-spacing="2">DATA SOURCES</text>

  <!-- CMS -->
  <rect x="40" y="122" width="200" height="58" rx="6" fill="white" stroke="#2c7fb8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="144" text-anchor="middle" fill="#1a5276" font-size="11" font-weight="bold">CMS Shared Patient</text>
  <text x="140" y="159" text-anchor="middle" fill="#5d6d7e" font-size="10">49.3M provider pairs</text>
  <text x="140" y="172" text-anchor="middle" fill="#5d6d7e" font-size="9">2015 · 60-day window</text>

  <!-- NPPES -->
  <rect x="270" y="122" width="200" height="58" rx="6" fill="white" stroke="#2c7fb8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="144" text-anchor="middle" fill="#1a5276" font-size="11" font-weight="bold">NPPES NPI Registry</text>
  <text x="370" y="159" text-anchor="middle" fill="#5d6d7e" font-size="10">8M+ providers · 330 cols</text>
  <text x="370" y="172" text-anchor="middle" fill="#5d6d7e" font-size="9">National provider directory</text>

  <!-- NUCC -->
  <rect x="500" y="122" width="200" height="58" rx="6" fill="white" stroke="#2c7fb8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="144" text-anchor="middle" fill="#1a5276" font-size="11" font-weight="bold">NUCC Taxonomy v15.1</text>
  <text x="600" y="159" text-anchor="middle" fill="#5d6d7e" font-size="10">838 codes · 10 OB-GYN (207V)</text>
  <text x="600" y="172" text-anchor="middle" fill="#5d6d7e" font-size="9">Specialty classification</text>

  <!-- CDC WONDER -->
  <rect x="730" y="122" width="200" height="58" rx="6" fill="white" stroke="#2c7fb8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="830" y="144" text-anchor="middle" fill="#1a5276" font-size="11" font-weight="bold">CDC WONDER Natality</text>
  <text x="830" y="159" text-anchor="middle" fill="#5d6d7e" font-size="10">627 counties · births + morbidity</text>
  <text x="830" y="172" text-anchor="middle" fill="#5d6d7e" font-size="9">2016 · 5 morbidity indicators</text>

  <!-- Census -->
  <rect x="960" y="122" width="200" height="58" rx="6" fill="white" stroke="#2c7fb8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1060" y="144" text-anchor="middle" fill="#1a5276" font-size="11" font-weight="bold">Census ZCTA Crosswalk</text>
  <text x="1060" y="159" text-anchor="middle" fill="#5d6d7e" font-size="10">ZIP → County FIPS mapping</text>
  <text x="1060" y="172" text-anchor="middle" fill="#5d6d7e" font-size="9">2010 Census</text>

  <!-- Arrows from data sources down -->
  <line x1="140" y1="180" x2="140" y2="210" stroke="#aab7c4" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="370" y1="180" x2="370" y2="210" stroke="#aab7c4" stroke-width="1.5"/>
  <line x1="600" y1="180" x2="600" y2="210" stroke="#aab7c4" stroke-width="1.5"/>
  <line x1="830" y1="180" x2="830" y2="210" stroke="#aab7c4" stroke-width="1.5"/>
  <line x1="1060" y1="180" x2="1060" y2="210" stroke="#aab7c4" stroke-width="1.5"/>

  <!-- Connector line across -->
  <line x1="140" y1="210" x2="1060" y2="210" stroke="#aab7c4" stroke-width="1.5"/>
  <line x1="600" y1="210" x2="600" y2="230" stroke="#aab7c4" stroke-width="2"/>

  <!-- PHASE 1 -->
  <g transform="translate(0, 0)">
    <rect x="80" y="235" width="480" height="100" rx="8" fill="url(#phase1Grad)" filter="url(#shadow)"/>
    <rect x="80" y="235" width="36" height="100" rx="8" fill="#1a5276"/>
    <rect x="98" y="235" width="18" height="100" fill="#1a5276"/>
    <text x="98" y="293" text-anchor="middle" fill="white" font-size="13" font-weight="bold" transform="rotate(-90,98,293)">P1</text>
    <text x="330" y="260" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Data Acquisition &amp; Validation</text>
    <text x="330" y="280" text-anchor="middle" fill="#d6eaf8" font-size="11">Load all datasets · Verify schemas &amp; row counts</text>
    <text x="330" y="298" text-anchor="middle" fill="#d6eaf8" font-size="11">Integrity checks (NPI format, date ranges, thresholds)</text>
    <text x="330" y="316" text-anchor="middle" fill="#aed6f1" font-size="10" font-style="italic">Output: Validated raw files ready for filtering</text>
  </g>

  <!-- PHASE 2 -->
  <g transform="translate(0, 0)">
    <rect x="620" y="235" width="500" height="100" rx="8" fill="url(#phase2Grad)" filter="url(#shadow)"/>
    <rect x="620" y="235" width="36" height="100" rx="8" fill="#145a32"/>
    <rect x="638" y="235" width="18" height="100" fill="#145a32"/>
    <text x="638" y="293" text-anchor="middle" fill="white" font-size="13" font-weight="bold" transform="rotate(-90,638,293)">P2</text>
    <text x="880" y="260" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Data Preparation</text>
    <text x="880" y="280" text-anchor="middle" fill="#d5f5e3" font-size="11">Filter NPPES → 60K OB-GYN providers (207V taxonomy)</text>
    <text x="880" y="298" text-anchor="middle" fill="#d5f5e3" font-size="11">Filter CMS → 243K edges (≥1 OB-GYN per pair)</text>
    <text x="880" y="316" text-anchor="middle" fill="#abebc6" font-size="10" font-style="italic">Output: obgyn_providers.csv · obgyn_edges.csv · county_morbidity_rates.csv</text>
  </g>

  <!-- Arrow P1 to P2 -->
  <line x1="560" y1="285" x2="618" y2="285" stroke="white" stroke-width="2.5"/>
  <polygon points="616,279 626,285 616,291" fill="white"/>

  <!-- Arrow down from P1/P2 to P3 -->
  <line x1="400" y1="335" x2="400" y2="365" stroke="#aab7c4" stroke-width="2"/>
  <polygon points="394,363 400,373 406,363" fill="#aab7c4"/>

  <!-- PHASE 3 -->
  <rect x="80" y="375" width="480" height="115" rx="8" fill="url(#phase3Grad)" filter="url(#shadow)"/>
  <rect x="80" y="375" width="36" height="115" rx="8" fill="#4a235a"/>
  <rect x="98" y="375" width="18" height="115" fill="#4a235a"/>
  <text x="98" y="440" text-anchor="middle" fill="white" font-size="13" font-weight="bold" transform="rotate(-90,98,440)">P3</text>
  <text x="330" y="400" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Exploratory Data Analysis</text>
  <text x="330" y="420" text-anchor="middle" fill="#e8daef" font-size="11">Provider distribution by state &amp; subspecialty</text>
  <text x="330" y="438" text-anchor="middle" fill="#e8daef" font-size="11">Edge weight distributions · Same-day encounter ratios</text>
  <text x="330" y="456" text-anchor="middle" fill="#e8daef" font-size="11">Degree distributions · Hub identification</text>
  <text x="330" y="474" text-anchor="middle" fill="#d2b4de" font-size="10" font-style="italic">Output: Visualizations · Early correlation signals</text>

  <!-- PHASE 4 -->
  <rect x="620" y="375" width="500" height="115" rx="8" fill="url(#phase4Grad)" filter="url(#shadow)"/>
  <rect x="620" y="375" width="36" height="115" rx="8" fill="#935006"/>
  <rect x="638" y="375" width="18" height="115" fill="#935006"/>
  <text x="638" y="440" text-anchor="middle" fill="white" font-size="13" font-weight="bold" transform="rotate(-90,638,440)">P4</text>
  <text x="880" y="400" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Network Analysis</text>
  <text x="880" y="420" text-anchor="middle" fill="#fdebd0" font-size="11">Build weighted graph: 72K nodes · 152K edges</text>
  <text x="880" y="438" text-anchor="middle" fill="#fdebd0" font-size="11">Centrality: degree · betweenness · eigenvector</text>
  <text x="880" y="456" text-anchor="middle" fill="#fdebd0" font-size="11">Louvain community detection (957 communities)</text>
  <text x="880" y="474" text-anchor="middle" fill="#f5cba7" font-size="10" font-style="italic">Output: Provider tiers (Hub / Connected / Peripheral / Isolated)</text>

  <!-- Arrow P3 to P4 -->
  <line x1="560" y1="432" x2="618" y2="432" stroke="white" stroke-width="2.5"/>
  <polygon points="616,426 626,432 616,438" fill="white"/>

  <!-- Arrow down to P5 -->
  <line x1="600" y1="490" x2="600" y2="530" stroke="#aab7c4" stroke-width="2"/>
  <polygon points="594,528 600,538 606,528" fill="#aab7c4"/>

  <!-- PHASE 5 -->
  <rect x="180" y="540" width="840" height="120" rx="8" fill="url(#phase5Grad)" filter="url(#shadow)"/>
  <rect x="180" y="540" width="36" height="120" rx="8" fill="#922b21"/>
  <rect x="198" y="540" width="18" height="120" fill="#922b21"/>
  <text x="198" y="608" text-anchor="middle" fill="white" font-size="13" font-weight="bold" transform="rotate(-90,198,608)">P5</text>
  <text x="618" y="565" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Geographic Overlay &amp; Target Identification</text>
  <text x="618" y="588" text-anchor="middle" fill="#fadbd8" font-size="11">Map providers to counties via Census ZCTA crosswalk → 577 counties with both network + morbidity data</text>
  <text x="618" y="608" text-anchor="middle" fill="#fadbd8" font-size="11">Pearson correlation: eigenvector centrality vs. morbidity (r = −0.138, p &lt; 0.001)</text>
  <text x="618" y="628" text-anchor="middle" fill="#fadbd8" font-size="11">OLS regression · Choropleth maps · Target county identification</text>
  <text x="618" y="648" text-anchor="middle" fill="#f5b7b1" font-size="10" font-style="italic">Output: 51 target counties across 27 states (435,657 births affected)</text>

  <!-- Footer -->
  <text x="600" y="693" text-anchor="middle" fill="#aab7c4" font-size="9">Data: CMS (2015) · NPPES (2026) · NUCC v15.1 · CDC WONDER (2016) · Census ZCTA (2010)</text>
  <text x="600" y="708" text-anchor="middle" fill="#aab7c4" font-size="9">Trinidad Cisneros · trinidadcisneros.com · MIT Applied AI &amp; Data Science Program</text>
</svg>
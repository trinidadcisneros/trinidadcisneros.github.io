<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  <link rel="stylesheet" type="text/css" href='../../static/css/navbar.css' )>
  <link rel="stylesheet" type="text/css" href='../../static/css/footer.css' )>
  <link rel="stylesheet" type="text/css" href='../../static/css/theme.css' )>
  <link rel="stylesheet" type="text/css" href='../../static/css/section_landing.css' )>
  <style>
    /* ---- Contact Form Card ---- */
    .contact-wrapper {
      max-width: 560px;
      margin: 2.5rem auto;
      padding: 0 1.5rem 2rem;
    }

    .contact-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 2rem 2rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .contact-card fieldset {
      border: none;
      margin: 0 0 1rem;
      padding: 0;
      min-width: 100%;
    }

    .contact-card label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 0.35rem;
    }

    .contact-card input[type="text"],
    .contact-card input[type="email"],
    .contact-card textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fafafa;
      padding: 0.65rem 0.75rem;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .contact-card input:focus,
    .contact-card textarea:focus {
      outline: none;
      border-color: #4a7fb5;
      background: #fff;
    }

    .contact-card textarea {
      height: 130px;
      resize: vertical;
    }

    .contact-card button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 4px;
      background: #0f3460;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .contact-card button[type="submit"]:hover {
      background: #4a7fb5;
    }

    .contact-card button[type="submit"]:active {
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
    }

    @media (max-width: 600px) {
      .contact-wrapper { padding: 0 1rem 1.5rem; margin-top: 1.5rem; }
      .contact-card { padding: 1.5rem 1.25rem 1.25rem; }
    }
  </style>
</head>
<body>
  <div id="page-container">
    <div id="content-wrap">
      <div w3-include-html="../navbar_footer/navbar_pages.html"></div>

      <div class="section-hero">
        <h1>Contact</h1>
        <p class="section-subtitle">Have a question, collaboration idea, or just want to connect? Send me a message and I'll get back to you.</p>
      </div>

      <div class="contact-wrapper">
        <div class="contact-card">
          <form id="contact" action="https://formspree.io/xyygvvvj" method="post">
            <fieldset>
              <label for="contact-name">Name</label>
              <input id="contact-name" name="name" type="text" tabindex="1" required autofocus>
            </fieldset>
            <fieldset>
              <label for="contact-email">Email</label>
              <input id="contact-email" type="email" name="_replyto" tabindex="2" required>
            </fieldset>
            <fieldset>
              <label for="contact-message">Message</label>
              <textarea id="contact-message" name="message" tabindex="3" required></textarea>
            </fieldset>
            <fieldset>
              <button name="submit" type="submit" value="Send" data-submit="...Sending">Send Message</button>
            </fieldset>
          </form>
        </div>
      </div>

    </div>
    <div w3-include-html="../navbar_footer/footer.html"></div>
  </div>
  <script type="text/javascript" src="../../static/js/include.js"></script>
</body>
</html>
